[workspace]
members = ["crates/platform-spike", "crates/config", "crates/cabby"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
cabby-config = { path = "crates/config" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "wayland"] }
iced_exwlshell = { version = "=0.20.1", default-features = false, features = ["macros"] }

[profile.dev]
debug = 1
