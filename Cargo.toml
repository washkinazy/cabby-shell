[workspace]
members = ["crates/clipboard", "crates/lock", "crates/tray", "crates/bluetooth", "crates/audio", "crates/platform-spike", "crates/shell", "crates/config", "crates/cabby", "crates/launcher", "crates/notifications", "crates/notification-service"]
resolver = "3"
exclude = ["vendor/exwlshellev", "vendor/iced_exwlshell", "vendor/iced_wayland_subscriber"]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
cabby-launcher = { path = "crates/launcher" }
cabby-config = { path = "crates/config" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "wayland", "image-without-codecs", "svg"] }
iced_exwlshell = { version = "=0.20.1", default-features = false, features = ["macros"] }

[profile.dev]
debug = 1

[patch.crates-io]
exwlshellev = { path = "vendor/exwlshellev" }
iced_exwlshell = { path = "vendor/iced_exwlshell" }
iced_wayland_subscriber = { path = "vendor/iced_wayland_subscriber" }
