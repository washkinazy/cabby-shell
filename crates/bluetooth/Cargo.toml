[package]
name = "cabby-bluetooth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
futures-util = "=0.3.34"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "=1.54.1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
