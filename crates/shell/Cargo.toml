[package]
name = "cabby-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cabby-clipboard = { path = "../clipboard" }
image_codec = { package = "image", version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
cabby-lock = { path = "../lock" }
futures-util = "=0.3.34"
libc = "=0.2.191"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
cabby-tray = { path = "../tray" }
cabby-bluetooth = { path = "../bluetooth" }
cabby-audio = { path = "../audio" }
cabby-notifications = { path = "../notifications" }
cabby-notification-service = { path = "../notification-service" }
cabby-launcher.workspace = true
cabby-config.workspace = true
iced.workspace = true
iced_exwlshell.workspace = true
log = "=0.4.34"

serde.workspace = true
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["net", "io-util", "time", "rt", "macros", "process"] }

[dev-dependencies]
tempfile = "3"
