[package]
name = "cabby-screenshot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
libc = "=0.2.191"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time", "macros", "process", "io-util"] }

[dev-dependencies]
tempfile = "=3.27.0"
