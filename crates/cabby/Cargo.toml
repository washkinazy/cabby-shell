[package]
name = "cabby"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cabby-clipboard = { path = "../clipboard" }
cabby-audio = { path = "../audio" }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
futures-util = "=0.3.34"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time", "net", "macros", "process"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
libc = "=0.2.191"
cabby-launcher.workspace = true
cabby-config.workspace = true
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
