# Device panels follow the clicked widget/output and configured bar edge.
# Default regions: workspaces left; clock/date middle; audio, network, Bluetooth, tray right.
# Tray icons and menus share desktop styling; ordinary reloads preserve menus and tray ownership.
# The coordinator automatically reloads valid saves (300 ms debounce); invalid edits retain the old config.
# Bluetooth shares theme/layout settings; ordinary reload preserves the panel and discovery/pairing.
# Audio panel shares renderer/font/theme and bar clearance; ordinary reload preserves the panel.
# Managed desktop hosts bar + wallpaper together; restart-ui restarts both.
# Notifications share renderer/theme settings; ordinary reloads preserve cards and active notices.
# Explicit alternative for systems without a working hardware Vulkan path.
# This is not considered a successful GPU validation.
renderer = "software"
bar_height = 48

# Alternative bottom bar with title hidden.
bar_position = "bottom"
show_window_title = false

# Optional terminal integration; foot must be installed separately to use this.
launcher_terminal = ["foot", "-e"]
launcher_width = 720
launcher_rows = 6
