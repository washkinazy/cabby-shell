# Launcher row sizing includes 24-pixel icons; search/close/status stay outside result scrolling.
# Audio/Bluetooth widgets observe status while configured; Bluetooth interaction ends on panel close.
# Device panels follow the clicked widget/output and configured bar edge.
# Default regions: workspaces left; clock/date middle; audio, network, Bluetooth, tray right.
# Tray icons and menus share desktop styling; ordinary reloads preserve menus and tray ownership.
# The coordinator automatically reloads valid saves (300 ms debounce); invalid edits retain the old config.
# Bluetooth shares theme/layout settings; ordinary reload preserves the panel and discovery/pairing.
# Audio panel shares renderer/font/theme and bar clearance; ordinary reload preserves the panel.
# Managed desktop hosts bar + wallpaper together; restart-ui restarts both.
# Notifications share renderer/theme settings; ordinary reloads preserve cards and active notices.
# All settings at their defaults. Install as ~/.config/cabby-shell/config.toml.
# Reference: docs/configuration.md. Ordinary changes apply live; renderer changes require a restart.

# UI renderer: "vulkan" (hardware path) or "software" (tiny-skia).
# Vulkan explicitly overrides an inherited WGPU_BACKEND=gl for the UI child.
renderer = "vulkan"

# Bar height and reserved area in logical pixels: integer, 32 through 128.
bar_height = 40
# Widget order within each independent region. [] leaves a region empty.
# A widget may occur only once across all three lists.
bar_left = ["workspaces"]
# Middle uses its content width; equal sides share the remaining bar space.
bar_middle = ["clock"]
bar_right = ["audio", "network", "bluetooth", "caffeine", "nightlight", "tray"]

# Bar edge: "top" or "bottom". Reserved space follows the edge.
bar_position = "top"
# Horizontal outer padding and gaps between widgets, 0..32 logical pixels.
bar_padding = 8
bar_spacing = 8
# Text size: 10..32 logical pixels, at least 8 smaller than bar_height.
font_size = 14
# Opaque RGB colors in #RRGGBB format.
background = "#181b22"
foreground = "#e5e9f0"
accent = "#88c0d0"
# Show the title when the optional "title" widget is included in a region.
show_window_title = true

# Launcher width in logical pixels (320..1200), and visible result rows (4..12).
launcher_width = 640
launcher_rows = 8
# Literal terminal executable/argument prefix; [] shows a configuration error
# for Terminal=true apps. Example: ["foot", "-e"] if foot is installed.
launcher_terminal = []

# Empty image means a solid color. Nonempty PNG/JPEG paths are relative to this file.
wallpaper_image = ""
# Color behind transparent images and outside fit/center images: #RRGGBB.
wallpaper_color = "#181b22"
# Image placement: "fill", "fit", "stretch", or "center".
wallpaper_mode = "fill"

# Automatic lock after 600 idle seconds; 0 disables. Requires lock support.
idle_lock_seconds = 0
# Optional "idle" bar widget toggles the manual idle inhibitor; not in defaults.

# Display power-off timeout: 0 disables; otherwise greater than idle_lock_seconds.
idle_display_off_seconds = 0

# Observe logind sleep notifications and hold a bounded delay inhibitor.
lock_before_sleep = false

# Night light: separate scheduled enable and forced night temperature.
[nightlight]
enabled = false
force = false
temperature_day = 6500
temperature_night = 4000

# Location source; set a city, coordinates, automatic lookup, or explicit custom times.
[location]
auto_locate = false
address = ""
custom_schedule = false
sunset = ""
sunrise = ""
# Optional coordinates are omitted by default; see nightlight-location.toml.

[caffeine]
audio = false
fullscreen = false
fullscreen_requires_focus = true
inhibit_idle = true
inhibit_sleep = true
manual_pause_nightlight = false
fullscreen_pause_nightlight = true
