# Solid Fluent-inspired UI: opaque surfaces; neutral controls; accent markers.
# Launcher row sizing includes 24-pixel icons; search/close/status stay outside result scrolling.
# Audio/Bluetooth widgets observe status while configured; Bluetooth interaction ends on panel close.
# Device panels follow the clicked widget/output and configured bar edge.
# Default regions: workspaces left; clock/date middle; audio, network, Bluetooth, night light, tray right.
# Tray icons and menus share desktop styling; ordinary reloads preserve menus and tray ownership.
# The coordinator automatically reloads valid saves (300 ms debounce); invalid edits retain the old config.
# Bluetooth shares theme/layout settings; ordinary reload preserves the panel and discovery/pairing.
# Audio panel shares renderer/font/theme and bar clearance; ordinary reload preserves the panel.
# Managed desktop hosts bar + wallpaper together; restart-ui restarts both.
# Notifications share renderer/theme settings; ordinary reloads preserve cards and active notices.
# Empty configuration uses all built-in defaults: Vulkan and a 40px bar.

# idle_lock_seconds is omitted: automatic locking stays disabled (0).
# Optional "idle" bar widget toggles the manual idle inhibitor; not in defaults.
# idle_display_off_seconds defaults to 0: no automatic display power change.
# lock_before_sleep defaults to false; opt-in sleep coordination needs lock support.
# Night light is disabled unless configured; the default bar includes its indicator.
